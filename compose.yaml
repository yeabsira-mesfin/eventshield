services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventshield
      POSTGRES_DB: eventshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - eventshield_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U eventshield"]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://eventshield:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/eventshield
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD}
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
volumes:
  eventshield_pg:
